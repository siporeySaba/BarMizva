<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אישור הגעה לבר מצווה</title>
<!-- תצוגה מקדימה בוואטסאפ / פייסבוק -->
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="בר מצווה לאורי עוז 🎉">
<meta property="og:description" content="יום שני, 7.12 · כ״ז בכסלו · 19:00 · מועדון בני נצרים. נשמח לאישור הגעה!">
<meta name="description" content="יום שני, 7.12 · כ״ז בכסלו · 19:00 · מועדון בני נצרים. נשמח לאישור הגעה!">
<meta name="theme-color" content="#17236B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#17236B;--gold:#F6B93B;--sky:#DDF1FF;--pink:#FF5C8A;--ink:#1B2150;--line:#C9D8F0}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Heebo,Arial,sans-serif;color:var(--ink);background:var(--sky);min-height:100vh;font-size:17px}
.hero{background:var(--night);color:#fff;text-align:center;padding:44px 20px 90px;position:relative;overflow:hidden;
  background-image:radial-gradient(circle at 12% 25%,var(--gold) 0 5px,transparent 6px),radial-gradient(circle at 88% 18%,var(--pink) 0 6px,transparent 7px),radial-gradient(circle at 78% 70%,#5CC8F2 0 5px,transparent 6px),radial-gradient(circle at 22% 78%,var(--pink) 0 4px,transparent 5px),radial-gradient(circle at 50% 10%,var(--gold) 0 3px,transparent 4px)}
.lights{font-size:34px;letter-spacing:6px}
h1{font-family:'Secular One',Heebo,sans-serif;font-weight:400;font-size:clamp(34px,10vw,52px);line-height:1.1;margin:10px 0 8px;color:var(--gold)}
.hero p{margin:4px 0;font-size:18px}
.hero .name{font-family:'Secular One',Heebo,sans-serif;font-size:26px}
main{max-width:480px;margin:-56px auto 40px;padding:0 16px;position:relative}
.card{background:#fff;border-radius:26px;padding:26px 20px;box-shadow:0 10px 30px rgba(23,35,107,.18);border:3px solid var(--gold)}
h2{font-family:'Secular One',Heebo,sans-serif;font-weight:400;font-size:24px;margin:0 0 18px;text-align:center}
label,.lbl{display:block;font-weight:700;margin:18px 0 8px}
input[type=text],textarea{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{font:inherit;font-weight:700;padding:14px 8px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.choice button[aria-pressed=true]{background:var(--night);border-color:var(--night);color:#fff}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:56px;height:56px;border-radius:50%;border:none;background:var(--gold);color:var(--night);font-size:30px;font-weight:700;cursor:pointer}
.stepper output{font-family:'Secular One',Heebo,sans-serif;font-size:44px;min-width:64px;text-align:center}
.hint{text-align:center;font-size:14px;opacity:.75;margin:6px 0 0}
.send{width:100%;margin-top:24px;font:inherit;font-weight:700;font-size:20px;padding:16px;border:none;border-radius:16px;background:var(--pink);color:#fff;cursor:pointer;box-shadow:0 5px 0 #C93E67}
.send:active{transform:translateY(3px);box-shadow:0 2px 0 #C93E67}
.send:disabled{opacity:.6}
.decline{width:100%;margin-top:12px;font:inherit;font-weight:700;padding:14px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.err{color:#B3123F;font-weight:700;text-align:center;margin-top:14px;min-height:1.2em}
.hidden{display:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px;margin:16px auto 0}
.actions a,.actions button{font:inherit;font-weight:700;font-size:15px;padding:10px 8px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;text-decoration:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.actions .wide{grid-column:1/-1}
.prev{background:#FFF7E3;border:2px dashed var(--gold);border-radius:16px;padding:12px 14px;margin-bottom:16px;text-align:center}
.prev b{display:block;margin-bottom:6px}
.thanks{text-align:center}
.thanks .big{font-size:60px}
.confetti{position:fixed;top:-20px;font-size:26px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
</style>
</head>
<body>
<header class="hero">
  <div class="lights" aria-hidden="true">🕎 ✡️ 🕎</div>
  <h1>בר מצווה!</h1>
  <p class="name" id="evName"></p>
  <p id="evDate"></p>
  <p id="evPlace"></p>
  <div class="actions">
    <a id="waze" target="_blank" rel="noopener">🚗 Waze</a>
    <a id="gmaps" target="_blank" rel="noopener">📍 Google Maps</a>
    <a id="gcal" class="wide" target="_blank" rel="noopener">📅 הוספה ליומן</a>
  </div>
</header>

<main>
  <section class="card" id="formCard">
    <h2>נשמח לראות אתכם! 🎉</h2>

    <div id="prev" class="prev hidden"></div>
    <div id="step1">
      <label for="name" style="margin-top:0">שם מלא</label>
      <input type="text" id="name" autocomplete="name" maxlength="70" placeholder="למשל: ישראל ישראלי">
      <button class="send" id="open" type="button">מגיעים! 🥳</button>
      <button class="decline" id="decline" type="button">מצטערים, לא נגיע</button>
    </div>

    <div id="step2" class="hidden">
      <div class="lbl" id="hello" style="margin-top:0;text-align:center"></div>
      <div class="lbl" style="text-align:center">כמה אורחים מגיעים (כולל אתכם)?</div>
      <div class="stepper">
        <button type="button" id="minus" aria-label="פחות">−</button>
        <output id="count" aria-live="polite">1</output>
        <button type="button" id="plus" aria-label="יותר">+</button>
      </div>
      <button class="send" id="send" type="button">שליחת אישור הגעה</button>
    </div>

    <div class="err" id="err" role="alert"></div>
  </section>

  <section class="card thanks hidden" id="thanksCard">
    <div class="big">🎊</div>
    <h2>תודה רבה!</h2>
    <p id="thanksMsg"></p>
    <p>מחכים לראות אתכם בשמחה!</p>
  </section>
</main>

<script type="module">
import { firebaseConfig, EVENT } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
$("evName").textContent = EVENT.name;
$("evDate").textContent = EVENT.time ? `${EVENT.date} · בשעה ${EVENT.time}` : EVENT.date;
$("evPlace").textContent = EVENT.place;

// ניווט + יומן
$("waze").href = `https://waze.com/ul?ll=${EVENT.lat},${EVENT.lng}&navigate=yes`;
$("gmaps").href = `https://www.google.com/maps/dir/?api=1&destination=${EVENT.lat},${EVENT.lng}`;
{
  const d = EVENT.dateISO.replace(/-/g, "");
  let dates;
  if (EVENT.time) {
    const [h, m] = EVENT.time.split(":").map(Number);
    const end = new Date(2000, 0, 1, h + 4, m);
    const p = n => String(n).padStart(2, "0");
    dates = `${d}T${p(h)}${p(m)}00/${d}T${p(end.getHours())}${p(end.getMinutes())}00`;
  } else {
    const next = new Date(EVENT.dateISO + "T12:00"); next.setDate(next.getDate() + 1);
    dates = `${d}/${next.toISOString().slice(0, 10).replace(/-/g, "")}`;
  }
  $("gcal").href = "https://calendar.google.com/calendar/render?" + new URLSearchParams({
    action: "TEMPLATE", text: `בר מצווה – ${EVENT.name}`, dates,
    location: `${EVENT.place} (${EVENT.lat},${EVENT.lng})`, ctz: "Asia/Jerusalem",
  });
}

// אם כבר אישרו מהמכשיר הזה – מציגים ומאפשרים לעדכן (בדף הניהול נספר רק האישור האחרון לכל שם)
const PREV_KEY = "barmitzva.rsvp";
let prev = null;
try { prev = JSON.parse(localStorage.getItem(PREV_KEY) || "null"); } catch {}
if (prev?.name) {
  $("name").value = prev.name;
  $("prev").innerHTML = "";
  const b = document.createElement("b");
  b.textContent = prev.attending
    ? `כבר אישרתם הגעה של ${prev.guests} ${prev.guests === 1 ? "אורח" : "אורחים"} 👍`
    : "כבר עדכנתם שלא תגיעו";
  $("prev").append(b, document.createTextNode("רוצים לשנות? פשוט שלחו שוב – האישור הקודם יוחלף."));
  $("prev").classList.remove("hidden");
}

let guests = prev?.attending ? prev.guests : 1;
const setGuests = n => { guests = Math.min(20, Math.max(1, n)); $("count").textContent = guests; };
$("plus").onclick = () => setGuests(guests + 1);
$("minus").onclick = () => setGuests(guests - 1);

function confetti() {
  const items = ["🎉", "✨", "🕎", "🎈", "⭐"];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement("span");
    s.className = "confetti";
    s.textContent = items[i % items.length];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 5500);
  }
}

function getName() {
  const name = $("name").value.trim();
  if (name.split(/\s+/).length < 2) {
    $("err").textContent = "נא למלא שם מלא (שם פרטי ושם משפחה)";
    $("name").focus();
    return null;
  }
  $("err").textContent = "";
  return name;
}

$("open").onclick = () => {
  const name = getName();
  if (!name) return;
  $("hello").textContent = `שמחים, ${name}!`;
  $("step1").classList.add("hidden");
  $("step2").classList.remove("hidden");
};

async function submit(attending) {
  const name = getName();
  if (!name) return;
  const btns = [$("send"), $("decline")];
  btns.forEach(b => b.disabled = true);
  try {
    await addDoc(collection(db, "rsvps"), {
      name, attending,
      guests: attending ? guests : 0,
      createdAt: serverTimestamp()
    });
    try { localStorage.setItem(PREV_KEY, JSON.stringify({ name, attending, guests: attending ? guests : 0 })); } catch {}
    $("thanksMsg").textContent = attending
      ? `אישרנו הגעה של ${guests} ${guests === 1 ? "אורח" : "אורחים"} על שם ${name}.`
      : `קיבלנו, ${name}. נתגעגע!`;
    $("formCard").classList.add("hidden");
    $("thanksCard").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (attending) confetti();
  } catch (e) {
    console.error(e);
    $("err").textContent = "השליחה לא הצליחה. נסו שוב בעוד רגע.";
    btns.forEach(b => b.disabled = false);
  }
}

$("send").onclick = () => submit(true);
$("decline").onclick = () => submit(false);
</script>
</body>
</html>
